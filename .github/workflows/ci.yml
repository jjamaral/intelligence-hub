name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm install --global typescript@5.8.3
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Reject unsafe TypeScript escapes
        run: |
          ! grep -RInE '(:|<|\bas\s+)any\b|@ts-ignore|@ts-expect-error' intelligence_hub/src intelligence_hub/tests
