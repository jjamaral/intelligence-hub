name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci --prefix intelligence_hub
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build Home Assistant App image
        run: docker build --build-arg BUILD_FROM=node:22.16.0-alpine --build-arg BUILD_VERSION=0.1.8 --build-arg BUILD_ARCH=amd64 --tag intelligence-hub:ci intelligence_hub
      - name: Reject unsafe TypeScript escapes
        run: |
          ! grep -RInE '(:|<|\bas\s+)any\b|@ts-ignore|@ts-expect-error' intelligence_hub/src intelligence_hub/tests
